name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: build / vet / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

  grpc:
    name: grpc build (-tags grpc)
    runs-on: ubuntu-latest
    needs: test
    steps:
      # grpc tag 启用的代码依赖 pb 文件；先 make proto 生成 stub 后再编译
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache: true

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc-gen-go / protoc-gen-go-grpc
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Download modules
        run: go mod download

      - name: Generate proto
        run: |
          export PATH="$PATH:$HOME/go/bin"
          make proto

      - name: Build with grpc tag
        run: go build -tags grpc ./...
