syntax = "proto3";

package goboilerplate.v1;

option go_package = "github.com/kenneth/go-boilerplate/proto/gen/go;goboilerplatev1";

import "google/protobuf/timestamp.proto";

// UserService 用户管理 gRPC 接口（与 HTTP /api/v1/users 对齐，复用同一 service 层）
service UserService {
  rpc GetUser    (GetUserRequest)    returns (User);
  rpc ListUsers  (ListUsersRequest)  returns (ListUsersResponse);
  rpc CreateUser (CreateUserRequest) returns (User);
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse);
}

message User {
  uint64                   id         = 1;
  string                   username   = 2;
  string                   nickname   = 3;
  string                   role       = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message GetUserRequest    { uint64 id = 1; }
message ListUsersRequest  { int32 page = 1; int32 size = 2; }
message ListUsersResponse { repeated User users = 1; int64 total = 2; }
message CreateUserRequest {
  string username = 1;
  string password = 2;
  string nickname = 3;
  string role     = 4;
}
message DeleteUserRequest  { uint64 id = 1; }
message DeleteUserResponse { bool ok = 1; }

// Greeter 演示服务（hello world）
service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
}
message HelloRequest { string name = 1; }
message HelloReply   { string message = 1; }
