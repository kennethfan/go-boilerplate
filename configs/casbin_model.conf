# Casbin RBAC 模型：角色 -> API 路径 -> HTTP 方法
# keyMatch2 支持 /api/v1/* 与 /api/v1/users/:id 风格匹配

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && keyMatch2(r.obj, p.obj) && (r.act == p.act || p.act == "*")
